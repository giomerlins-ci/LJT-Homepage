name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api -X POST /repos/${{ github.repository }}/pages \
            -f 'source[branch]=master' \
            -f 'source[path]=/' || echo "Pages may already be enabled"
          gh api /repos/${{ github.repository }}/pages || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
